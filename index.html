<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e30613">
<title>Confirmar Citas</title>

<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<main class="app">
<header class="hero">
  <div class="hero-inner">
    <img src="./verisure-logo.png" class="brand-logo" alt="Verisure">
    <div class="app-name">Confirmar Citas V1</div>
  </div>
  <button class="gear" id="settings" aria-label="Ajustes">⚙️</button>
</header>

<section id="stats"></section>
<nav id="tabs" class="tabs"></nav>

<section class="import-box">
  <button class="import-main" id="importClipboard">📋 IMPORTAR DESDE PORTAPAPELES</button>
  <div class="import-help">Oracle → Copiar texto → vuelve a esta pestaña → pulsa aquí</div>
</section>
<button class="manual-toggle" id="manualBtn">▶ Entrada manual</button>
<section id="manual" class="manual-panel hidden">
  <textarea id="raw" placeholder="Pega aquí el texto de Oracle"></textarea>
  <div class="row"><button class="primary" id="process">Procesar</button><button class="secondary" id="paste">Pegar</button></div>
</section>

<div id="ignored"></div>
<section id="results"></section>

<div class="footer-tools"><button class="secondary" id="newAgenda">Nueva agenda</button></div>
<div class="version">Confirmar Citas V1 · Web Chrome · funcionamiento local</div>
<button id="next" class="next hidden">📲 CONFIRMAR SIGUIENTE PENDIENTE</button>
</main>

<div id="modal" class="modal hidden">
 <section class="sheet">
   <div class="sheet-head"><h2 id="mtitle"></h2><button id="mclose" class="close">✕</button></div>
   <div id="mbody"></div>
 </section>
</div>
<script src="./app.js"></script>
</body></html>
